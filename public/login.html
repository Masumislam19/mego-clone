<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — MegoClone</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="auth-main">
  <div class="panel auth-panel">
    <h1>MegoClone</h1>

    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">Login</button>
      <button id="tab-signup" class="tab" type="button">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <input type="text" id="signup-username" placeholder="Username" required />
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Password (কমপক্ষে ৬ ক্যারেক্টার)" required />
      <button type="submit">Sign Up</button>
    </form>

    <p id="auth-error" class="auth-error hidden"></p>
  </div>
</main>

<script>
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const errorBox = document.getElementById('auth-error');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.remove('hidden');
}
function clearError() {
  errorBox.classList.add('hidden');
}

tabLogin.addEventListener('click', () => {
  tabLogin.classList.add('active');
  tabSignup.classList.remove('active');
  loginForm.classList.remove('hidden');
  signupForm.classList.add('hidden');
  clearError();
});

tabSignup.addEventListener('click', () => {
  tabSignup.classList.add('active');
  tabLogin.classList.remove('active');
  signupForm.classList.remove('hidden');
  loginForm.classList.add('hidden');
  clearError();
});

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (!res.ok) return showError(data.error || 'লগইন ব্যর্থ হয়েছে');
  window.location.href = '/';
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();
  const username = document.getElementById('signup-username').value;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;

  const res = await fetch('/api/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, email, password }),
  });
  const data = await res.json();
  if (!res.ok) return showError(data.error || 'সাইন আপ ব্যর্থ হয়েছে');
  window.location.href = '/';
});
</script>
</body>
</html>
